<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nibble prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4EC; --surface:#FFFFFF; --sunk:#E6EBE1; --ink:#1B2620; --muted:#56645B; --line:#D4DCCF;
  --saffron:#F2B632; --saffron-ink:#2A1E00; --saffron-soft:#FBEBC4;
  --leaf:#2D6A4A; --leaf-soft:#DCEDE2;
  --amber:#8A5300; --amber-soft:#FBE7C2;
  --danger:#A52A21; --danger-soft:#F8DDDA;
  --focus:#2D6A4A;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px; --r-pill:999px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121815; --surface:#1A221E; --sunk:#232D28; --ink:#E6ECE5; --muted:#9BA9A0; --line:#2F3B34;
    --saffron:#F2B632; --saffron-ink:#2A1E00; --saffron-soft:#3A2F12;
    --leaf:#86CFA5; --leaf-soft:#1E3529;
    --amber:#F2BA62; --amber-soft:#3B2C12;
    --danger:#F2A39C; --danger-soft:#3E1C19;
    --focus:#86CFA5; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121815; --surface:#1A221E; --sunk:#232D28; --ink:#E6ECE5; --muted:#9BA9A0; --line:#2F3B34;
  --saffron:#F2B632; --saffron-ink:#2A1E00; --saffron-soft:#3A2F12;
  --leaf:#86CFA5; --leaf-soft:#1E3529;
  --amber:#F2BA62; --amber-soft:#3B2C12;
  --danger:#F2A39C; --danger-soft:#3E1C19;
  --focus:#86CFA5; color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{display:inline-flex;flex:none}
.ic svg{display:block}

.app{max-width:760px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;margin:0;font:800 25px/1 var(--display);letter-spacing:-.03em}
.tabs{margin-left:auto;display:flex;gap:2px;padding:3px;background:var(--sunk);border-radius:var(--r-pill)}
.tab{border:0;background:none;padding:6px 14px;border-radius:var(--r-pill);font-weight:700;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.count{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--saffron);color:var(--saffron-ink);font-size:12px;line-height:18px;text-align:center}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.banner{margin:12px 16px 0;padding:10px 8px 10px 14px;border-radius:var(--r-md);background:var(--leaf-soft);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner p{margin:0;flex:1}

main{flex:1;padding:20px 16px 8px}
#chat-log{display:flex;flex-direction:column;gap:18px}
.msg{animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;max-width:85%;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:18px 18px 4px 18px}
.bot-row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.bot-body{min-width:0;display:flex;flex-direction:column;gap:10px}
.bot-text{margin:3px 0 0;font-size:17px}
.bot-help{margin:0;color:var(--muted);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:var(--r-pill);font-weight:700;font-size:15px}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.btn.primary{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:6px;text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.5;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:16px}
.panel.is-done{opacity:.6}
.field{display:flex;flex-direction:column;gap:6px}
.field-label{font-weight:700;font-size:15px}
.chip-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);cursor:text}
.chip-box:focus-within{border-color:var(--focus)}
.chips{display:contents}
.chip-input{flex:1;min-width:150px;border:0;background:transparent;padding:6px 4px;outline:none}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 3px 3px 11px;border-radius:var(--r-pill);background:var(--sunk);font-size:15px;line-height:1.3}
.chip.static{padding-right:11px}
.chip-like{background:var(--leaf-soft)}
.chip-allergen{background:var(--danger-soft)}
.chip-pantry{background:var(--saffron-soft)}
.chip-x{display:inline-grid;place-items:center;width:24px;height:24px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--muted)}
.chip-x:hover{background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink)}
.suggestions{display:flex;flex-wrap:wrap;gap:6px}
.sugg{display:inline-flex;align-items:center;gap:4px;padding:4px 11px 4px 7px;border-radius:var(--r-pill);border:1px dashed color-mix(in srgb,var(--ink) 32%,transparent);background:transparent;font-size:14px}
.sugg:hover{background:var(--sunk)}
.why{font-size:12px;color:var(--muted);margin-left:3px}
.select,.input,.textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper)}
.textarea{resize:vertical;min-height:76px}
.counter{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:var(--r-pill);padding:3px;background:var(--paper)}
.counter button{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center}
.counter button:disabled{opacity:.4;cursor:default}
.counter output{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.counter.sm{background:var(--surface)}
.counter.sm button{width:26px;height:26px;background:var(--paper)}
.counter.sm output{min-width:22px}
.preview{display:flex;flex-direction:column;gap:8px}
.pgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pgroup-label{font-size:13px;color:var(--muted);min-width:76px}
.detected{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.error{color:var(--danger);font-size:14px;margin:0}
.error:empty{display:none}

.dots{display:inline-flex;gap:5px;padding:9px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.trace{border-left:3px solid var(--line);padding-left:12px;color:var(--muted);font-size:14px}
.trace summary{cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:700;list-style:none}
.trace summary::-webkit-details-marker{display:none}
.trace summary .chev{transition:transform .15s}
.trace[open] summary .chev{transform:rotate(90deg)}
.sim{font-weight:400;font-size:12px;padding:1px 8px;border-radius:9px;background:var(--sunk)}
.trace-list{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.trace-list li{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:8px;align-items:baseline}
.trace-list code{font:12.5px/1.5 var(--mono);color:var(--ink);background:var(--sunk);padding:1px 6px;border-radius:6px;white-space:nowrap}

/* Recipe card */
.recipe{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;scroll-margin-top:76px}
.recipe-head{padding:18px 18px 16px;background:var(--saffron-soft);display:flex;flex-direction:column;gap:12px}
.head-top{display:flex;align-items:flex-start;gap:12px}
.recipe-title{margin:0;flex:1;font:700 clamp(24px,5.2vw,32px)/1.08 var(--display);letter-spacing:-.02em;text-wrap:balance}
.vpill{align-self:flex-start;flex:none;font-size:13px;font-weight:700;padding:3px 10px;border-radius:9px;background:var(--surface)}
.collapse-toggle{display:none;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:3px 12px;font-size:13px;font-weight:700}
.recipe.collapsible .collapse-toggle{display:inline-flex}
.recipe .show-l{display:none}
.recipe.is-collapsed .show-l{display:inline}
.recipe.is-collapsed .hide-l{display:none}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:15px}
.meta-i{display:inline-flex;align-items:center;gap:6px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:flex-start;gap:6px;padding:5px 10px;border-radius:var(--r-sm);font-size:14px;line-height:1.35;background:var(--surface)}
.badge .ic{margin-top:1px}
.badge.safe .ic{color:var(--leaf)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.badge.pantry .ic{color:var(--amber)}
.notes{margin:0;padding:10px 12px;border-radius:var(--r-md);background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.notes strong{font-size:13px}
.notes ul{margin:0;padding-left:18px}
.recipe.is-collapsed .meta,.recipe.is-collapsed .badges,.recipe.is-collapsed .notes,.recipe.is-collapsed .recipe-body,.recipe.is-collapsed .recipe-foot{display:none}
.recipe.is-collapsed .recipe-head{background:var(--surface);padding-block:12px}
.recipe.is-collapsed .recipe-title{font-size:19px}

.recipe-body{padding:0 18px 18px}
.rsec{padding-top:18px}
.rsec + .rsec{border-top:1px solid var(--line);margin-top:18px}
.rsec h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font:700 19px/1.2 var(--display)}
.rsec h3 .ic{color:var(--leaf)}
.rsec h3 .sub{font:400 14px var(--body);color:var(--muted);margin-left:auto}
.ing-list{list-style:none;margin:0;padding:0}
.ing{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0}
.ing + .ing{border-top:1px dashed var(--line)}
.ing input{width:20px;height:20px;accent-color:var(--leaf);margin:0}
.ing label{cursor:pointer}
.ing input:checked + label{text-decoration:line-through;color:var(--muted)}
.swap{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:transparent;border-radius:var(--r-pill);padding:3px 10px 3px 8px;font-size:13px;color:var(--muted)}
.swap:hover,.swap[aria-expanded="true"]{background:var(--sunk);color:var(--ink)}
.swap-panel{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-radius:var(--r-md);background:var(--paper);font-size:14px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:4px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:baseline}
.opt:hover:not(:disabled){border-color:var(--leaf)}
.opt small{color:var(--danger);font-size:12px}
.opt:disabled{cursor:not-allowed;color:var(--muted)}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px}
.steps li::before{content:counter(s);font:700 22px/1.1 var(--display);color:var(--leaf)}
.nut{display:flex;flex-direction:column;gap:11px}
.nut-row{display:grid;grid-template-columns:72px minmax(0,1fr) 128px;gap:12px;align-items:center;font-size:15px}
.nut-val{text-align:right;font-variant-numeric:tabular-nums}
.nut-val span{color:var(--muted)}
.bar{position:relative;height:10px;border-radius:99px;background:var(--sunk)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--leaf)}
.bar.warn i{background:var(--saffron)}
.bar.over i{background:var(--danger)}
.bar::before,.bar::after{content:"";position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink);opacity:.35}
.bar::before{left:25%}
.bar::after{left:75%}
.nut-foot{font-size:13px;color:var(--muted);margin:2px 0 0}
.recipe-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);background:var(--paper)}
.src{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.src a{color:inherit}
.btn.saved{background:var(--leaf-soft);border-color:var(--leaf-soft)}

/* Composer */
.composer{position:sticky;bottom:0;z-index:5;padding:8px 16px 14px;background:linear-gradient(to top,var(--paper) 78%,transparent)}
.refine-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.refine-row::-webkit-scrollbar{display:none}
.refine-row.inline{flex-wrap:wrap;overflow:visible;padding:0}
.rchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:6px 13px;font-size:14px;font-weight:700}
.rchip:hover{border-color:var(--leaf)}
.inputbar{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface)}
.inputbar:focus-within{border-color:var(--focus)}
.inputbar input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:6px 0}
.inputbar input:disabled{cursor:not-allowed}
.send{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:var(--saffron);color:var(--saffron-ink);display:grid;place-items:center}
.send:disabled{background:var(--sunk);color:var(--muted);cursor:default}

/* Saved */
.view-title{font:700 30px/1.1 var(--display);letter-spacing:-.02em;margin:4px 0 6px}
.muted{color:var(--muted)}
.small{font-size:14px}
.saved-list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.saved-item{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:2px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.saved-item:hover{border-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.saved-title{font:700 18px/1.2 var(--display)}
.saved-meta{grid-row:2;font-size:14px;color:var(--muted)}
.saved-item .ic{grid-row:1/3;grid-column:2;align-self:center;color:var(--muted)}
.empty{margin-top:24px;padding:28px 20px;border:1px dashed var(--line);border-radius:var(--r-lg);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted)}
.empty p{margin:0}
.back{border:0;background:none;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;padding:4px 0;margin-bottom:12px}
.vpills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.vtab{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:6px 12px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;font-weight:700}
.vtab span{font-weight:400;font-size:12.5px;color:var(--muted)}
.vtab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vtab[aria-selected="true"] span{color:color-mix(in srgb,var(--paper) 75%,transparent)}
.saved-refine{margin-top:16px;display:flex;flex-direction:column;gap:8px}

/* Toast + dialog */
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,12px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r-pill);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
dialog{border:0;padding:0;border-radius:var(--r-lg);background:var(--surface);color:var(--ink);width:min(560px,calc(100% - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,20,14,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;flex:1;font:700 22px/1.1 var(--display)}
.dlg-body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}

@media (max-width:520px){
  .brand{font-size:22px}
  .tab{padding:6px 11px}
  .recipe-head,.recipe-body,.recipe-foot{padding-left:14px;padding-right:14px}
  .nut-row{grid-template-columns:60px minmax(0,1fr) 100px;gap:8px;font-size:14px}
  .trace-list li{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <mask id="bite" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="28.5" cy="6" r="5.6" fill="#000"/>
      <circle cx="30.8" cy="13.4" r="3.6" fill="#000"/>
    </mask>
  </defs>
</svg>

<div class="app">
  <header class="top">
    <h1 class="brand"><span id="brand-logo"></span>Nibble</h1>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" id="tab-chat" type="button" aria-selected="true">Chat</button>
      <button class="tab" role="tab" id="tab-saved" type="button" aria-selected="false">Saved<span class="count" id="saved-count" hidden>0</span></button>
    </nav>
    <button class="iconbtn" id="new-chat" type="button" aria-label="New chat" title="New chat"></button>
  </header>

  <div class="banner" id="banner">
    <p>Clickable prototype for the team. Recipes, profiles and agent steps are simulated in your browser; nothing is sent anywhere.</p>
    <button class="chip-x" id="banner-x" type="button" aria-label="Dismiss"></button>
  </div>

  <main>
    <section id="view-chat" aria-label="Chat"><div id="chat-log"></div></section>
    <section id="view-saved" aria-label="Saved recipes" hidden></section>
  </main>

  <div class="composer" id="composer">
    <div class="refine-row" id="refine-row" hidden></div>
    <div class="inputbar" id="composer-form">
      <input id="composer-input" type="text" autocomplete="off" aria-label="Message" enterkeyhint="send">
      <button class="send" id="composer-send" type="button" aria-label="Send"></button>
    </div>
  </div>
</div>

<dialog id="editor" aria-label="Profile editor"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 60) : ms));
const $ = (s, root = document) => root.querySelector(s);

const ICONS = {
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

    el('div', { class:'field' }, el('label', { class:'field-label', for:'craving', text:'What are you in the mood for?' }), ta),
    el('div', { class:'field' }, el('span', { class:'field-label', text:'Servings' }), el('div', { class:'counter', role:'group', 'aria-label':'Servings' }, minus, out, plus)),
    err,
    el('div', { class:'row' }, submit, el('button', { type:'button', class:'btn ghost', onclick:() => {
      req.pantry.splice(0, req.pantry.length, 'chicken', 'rice', 'spinach'); pantryField.refresh();
      ta.value = 'Something comforting, with only one pot to wash';
    } }, 'Fill in the example'))
  );
  botSay(`What would ${activeProfile.name} like to eat?`, el('p', { class:'bot-help', text:'Add what you have, describe the meal, and set the servings.' }), panel);
}

function chipField({ label, hint, arr, section, kind }) {
  const id = 'f' + Math.random().toString(36).slice(2, 8);
  const chips = el('span', { class:'chips' });
  const input = el('input', { id, type:'text', class:'chip-input', placeholder:hint, autocomplete:'off' });
  const box = el('div', { class:'chip-box' }, chips, input);
  const sugg = el('div', { class:'suggestions' });
  const renderChips = () => chips.replaceChildren(...arr.map((t, i) => el('span', { class:`chip chip-${kind}` }, t,
    el('button', { type:'button', class:'chip-x', 'aria-label':`Remove ${t}`, onclick:e => { e.stopPropagation(); arr.splice(i, 1); renderChips(); renderSugg(); input.focus(); } }, icon('x', 14)))));
  const renderSugg = () => sugg.replaceChildren(...suggest(input.value, section, arr).map(s =>
    el('button', { type:'button', class:'sugg', onclick:() => { add(s.term); input.focus(); } }, icon('plus', 14), s.term, s.why ? el('span', { class:'why', text:WHY[s.why] }) : null)));
  const add = raw => {
    const t = raw.trim().toLowerCase().replace(/\s+/g, ' ');
    input.value = '';
    if (t && !arr.includes(t)) { arr.push(t); learn(t, section); renderChips(); }
    renderSugg();
  };
  input.addEventListener('input', renderSugg);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); add(input.value); }
    else if (e.key === 'Backspace' && !input.value && arr.length) { arr.pop(); renderChips(); }
  });
  box.addEventListener('click', e => { if (e.target === box) input.focus(); });
  renderChips();
  const wrap = el('div', { class:'field' }, el('label', { class:'field-label', for:id, text:label }), box, sugg);
  wrap.refresh = () => { renderChips(); renderSugg(); };
  return wrap;
}

/* ---------- profile editor ---------- */
function openEditor(profile, prefill, onSave) {
  const draft = profile
    ? { ...profile, likes:[...profile.likes], dislikes:[...profile.dislikes], allergens:[...profile.allergens] }
    : { id:'p' + Date.now(), name:'', likes:[...(prefill?.likes || [])], dislikes:[...(prefill?.dislikes || [])], allergens:[...(prefill?.allergens || [])] };
  const dlg = $('#editor');
  const name = el('input', { class:'input', id:'pname', type:'text', placeholder:'Who is this profile for?', autocomplete:'off' });
  name.value = draft.name;
  const err = el('p', { class:'error', role:'alert' });
  const save = el('button', { type:'button', class:'btn primary', onclick:() => {
    draft.name = name.value.trim();
    if (!draft.name) { err.textContent = 'Add a name so you can find this profile later.'; name.focus(); return; }
    if (profile) Object.assign(profile, draft); else profiles.push(draft);
    dlg.close();
    toast(profile ? `${draft.name}'s profile saved` : `Profile created for ${draft.name}`);
    onSave && onSave(profile || draft);
  } }, profile ? 'Save profile' : 'Create profile');
  dlg.replaceChildren(el('div', { class:'dlg' },
    el('div', { class:'dlg-head' }, el('h2', { text: profile ? `Edit ${profile.name}'s profile` : 'New profile' }),
      el('button', { type:'button', class:'iconbtn', 'aria-label':'Close', onclick:() => dlg.close() }, icon('x', 16))),
    el('div', { class:'dlg-body' },
      el('div', { class:'field' }, el('label', { class:'field-label', for:'pname', text:'Name' }), name),
      chipField({ label:'Allergies and intolerances', hint:'e.g. gluten, lactose, peanuts', arr:draft.allergens, section:'allergens', kind:'allergen' }),
      chipField({ label:'Dislikes', hint:'Ingredients to keep out', arr:draft.dislikes, section:'dislikes', kind:'dislike' }),
      chipField({ label:'Likes', hint:'Ingredients or flavours you enjoy', arr:draft.likes, section:'likes', kind:'like' }),
      err),
    el('div', { class:'dlg-foot' }, el('button', { type:'button', class:'btn', onclick:() => dlg.close() }, 'Cancel'), save)));
  dlg.showModal();
  name.focus();
}

/* ---------- recipes in chat ---------- */
async function generate(isReroll) {
  setComposer('locked');
  const res = pickRecipe(activeProfile, request, shown);
  if (!res.best) {
    await botThinking(500);
    botSay(`That's every recipe in this prototype that fits ${activeProfile.name}'s profile and this request.`,
      el('div', { class:'row' }, el('button', { type:'button', class:'btn primary', onclick:() => showRequestForm(request) }, 'Change the request')));
    if (currentThread) setComposer('refine');
    return;
  }
  shown.push(res.best.r.id);
  const t = { id:'t' + (threads.length + 1), servings:request.servings, pantry:[...request.pantry], profileId:activeProfile.id, versions:[res.best.v], saved:false, savedAt:0 };
  threads.push(t);
  currentThread = t;
  await postRecipe(t, 0, isReroll ? `Here's another option for ${activeProfile.name}.` : `Here's a recipe for ${activeProfile.name}.`, buildTrace(res, activeProfile, request));
  setComposer('refine');
}

function collapseCard(card) { card.classList.add('collapsible', 'is-collapsed'); }

async function postRecipe(t, idx, intro, trace) {
  const list = el('ol', { class:'trace-list' });
  const det = el('details', { class:'trace', open:true },
    el('summary', {}, el('span', { class:'chev' }, icon('chev', 14)), 'How Nibble made this', el('span', { class:'sim', text:'simulated' })), list);
  const body = el('div', { class:'bot-body' }, el('p', { class:'bot-text', text:intro }), det);
  addMsg('bot', el('div', { class:'bot-row' }, logoMark(28), body));
  for (const s of trace) {
    await wait(300);
    list.append(el('li', {}, el('code', { text:s.tool }), el('span', { text:s.text })));
    scrollDown();
  }
  await wait(250);
  det.open = false;
  log.querySelectorAll('.recipe:not(.is-collapsed)').forEach(collapseCard);
  const card = renderRecipeCard(t, idx, 'chat');
  body.append(card);
  card.scrollIntoView({ block:'start', behavior: reduced ? 'auto' : 'smooth' });
}

function renderRecipeCard(t, idx, ctx) {
  const v = t.versions[idx], p = getProfile(t), n = nutrition(v), S = t.servings;
  const isLatest = idx === t.versions.length - 1;
  const card = el('article', { class:'recipe', 'data-thread':t.id, 'data-v':String(idx) });
  const rerender = () => { const c = renderRecipeCard(t, idx, ctx); if (card.classList.contains('collapsible')) c.classList.add('collapsible'); card.replaceWith(c); };

  // header
  const toggle = el('button', { type:'button', class:'collapse-toggle', onclick:() => card.classList.toggle('is-collapsed') },
    el('span', { class:'show-l', text:'Show' }), el('span', { class:'hide-l', text:'Hide' }));
  const vpill = t.versions.length > 1 || idx > 0 ? el('span', { class:'vpill', text: idx === 0 ? 'Version 1' : `Version ${idx + 1}: ${v.label.toLowerCase()}` }) : null;
  const out = el('output', { text:String(S) });
  const sMinus = el('button', { type:'button', 'aria-label':'Fewer servings', disabled:S <= 1, onclick:() => { t.servings = Math.max(1, S - 1); rerender(); } }, icon('minus', 14));
  const sPlus = el('button', { type:'button', 'aria-label':'More servings', disabled:S >= 12, onclick:() => { t.servings = Math.min(12, S + 1); rerender(); } }, icon('plus', 14));
  const meta = el('div', { class:'meta' },
    el('span', { class:'meta-i' }, icon('clock'), `${v.time} min`),
    el('span', { class:'meta-i' }, icon('users'), el('span', { class:'counter sm', role:'group', 'aria-label':'Servings' }, sMinus, out, sPlus), S === 1 ? 'serving' : 'servings'),
    el('span', { class:'meta-i' }, icon('flame'), `${Math.round(n.kcal)} kcal per serving`));

  const badges = el('div', { class:'badges' });
  const avoid = [...p.allergens, ...p.dislikes];
  if (avoid.length) badges.append(el('span', { class:'badge safe' }, icon('shield', 16), `Checked for ${p.name}: no ${joinList(avoid).replace(/ and ([^,]*)$/, ' or $1')}`));
  const hits = pantryHits(t.pantry, v);
  if (hits.length) badges.append(el('span', { class:'badge pantry' }, icon('basket', 16), `Uses your ${joinList(hits)}`));
  warnList(n).forEach(w => badges.append(el('span', { class:'badge warn' }, icon('alert', 16), `One serving has ${w.pct}% of an adult's daily ${w.m === 'kcal' ? 'calories' : w.label.toLowerCase()}`)));
  badges.append(el('span', { class:'badge' }, icon('thermo', 16), safetyText(v)));

  const notes = v.notes.length ? el('div', { class:'notes' },
    el('strong', { text: idx === 0 ? `Adapted for ${p.name}` : 'What changed' }), el('ul', {}, v.notes.map(x => el('li', { text:x })))) : null;

  const head = el('div', { class:'recipe-head' },
    el('div', { class:'head-top' }, el('h2', { class:'recipe-title', text:v.title }), vpill, ctx === 'chat' ? toggle : null),
    meta, badges, notes);
  head.querySelector('.head-top').addEventListener('click', e => { if (card.classList.contains('is-collapsed') && !e.target.closest('button')) card.classList.remove('is-collapsed'); });

  // ingredients
  const ingList = el('ul', { class:'ing-list' });
  v.lines.forEach((L, li) => {
    if (L.removed) return;
    const cid = `${t.id}-${idx}-${li}-${Math.random().toString(36).slice(2, 6)}`;
    const row = el('li', { class:'ing' });
    const swapBtn = el('button', { type:'button', class:'swap', 'aria-expanded':'false', onclick:() => {
      const openPanel = row.querySelector('.swap-panel');
      if (openPanel) { openPanel.remove(); swapBtn.setAttribute('aria-expanded', 'false'); return; }
      swapBtn.setAttribute('aria-expanded', 'true');
      const opts = (SUBS[L.key] || []).filter(k => !v.lines.some(x => !x.removed && x.key === k));
      row.append(el('div', { class:'swap-panel' },
        opts.length ? [el('span', { class:'muted', text:`Swap ${ING[L.key].short} for:` }),
          opts.map(k => { const c = conflict(k, p); return el('button', { type:'button', class:'opt', disabled:!!c, title: c ? cap(reason(c, p)) : null,
            onclick:() => doChange(t, idx, () => applySwap(v, li, k), ctx) }, nm(k), c ? el('small', { text: c.type === 'allergen' ? `contains ${c.what}` : 'disliked' }) : null); })]
          : el('span', { class:'muted', text:'No swaps for this ingredient in the prototype yet.' })));
    } }, icon('swap', 14), 'Swap');
    row.append(el('input', { type:'checkbox', id:cid }), el('label', { for:cid, text:cap(lineText(L, S)) }), swapBtn);
    ingList.append(row);
  });

  const steps = el('ol', { class:'steps' }, v.steps.map(s => renderStep(s, v)).filter(Boolean).map(s => el('li', { text:s })));

  const nut = el('div', { class:'nut' }, ['kcal', 'fat', 'sugar', 'salt'].map(m => {
    const pct = Math.round(n[m] / DV[m] * 100);
    const cls = pct > 150 ? 'bar over' : pct >= 50 ? 'bar warn' : 'bar';
    const val = m === 'kcal' ? `${Math.round(n.kcal)} kcal` : `${n[m] < 10 ? n[m].toFixed(1) : Math.round(n[m])} g`;
    return el('div', { class:'nut-row' }, el('span', { text:DV_LABEL[m] }),
      el('div', { class:cls, role:'img', 'aria-label':`${pct}% of daily limit` }, el('i', { style:`width:${Math.min(100, pct / 2)}%` })),
      el('span', { class:'nut-val' }, val, el('span', { text:` (${pct}%)` })));
  }), el('p', { class:'nut-foot', text:`Protein: ${Math.round(n.protein)} g. Ticks mark 50% and 150% of an adult's daily limit (WHO and EU reference intakes). Under 50% shows no warning; over 150% makes Nibble change the recipe.` }));

  const body = el('div', { class:'recipe-body' },
    el('section', { class:'rsec' }, el('h3', {}, icon('carrot'), 'Ingredients', el('span', { class:'sub', text:`for ${S} ${S === 1 ? 'serving' : 'servings'}` })), ingList),
    el('section', { class:'rsec' }, el('h3', {}, icon('pot'), 'Steps'), steps),
    el('section', { class:'rsec' }, el('h3', {}, icon('chart'), 'Nutrition per serving'), nut));

  const saveBtn = el('button', { type:'button', class:`btn${t.saved ? ' saved' : ''}`, onclick:() => {
    t.saved = !t.saved; t.savedAt = Date.now();
    saveBtn.className = `btn${t.saved ? ' saved' : ''}`;
    saveBtn.lastChild.textContent = t.saved ? 'Saved' : 'Save recipe';
    updateSavedCount();
    toast(t.saved ? 'Saved. Find it under Saved, with every version.' : 'Removed from Saved');
  } }, icon('bookmark', 16), el('span', { text: t.saved ? 'Saved' : 'Save recipe' }));
  const foot = el('div', { class:'recipe-foot' },
    el('span', { class:'src' }, icon('link', 16), el('a', { href:'#', onclick:e => { e.preventDefault(); toast('In the real app this opens the original recipe.'); }, text:v.src })),
    el('div', { class:'row' }, saveBtn,
      ctx === 'chat' && isLatest && t === currentThread ? el('button', { type:'button', class:'btn', onclick:async () => { userSay('Show me another recipe'); await generate(true); } }, icon('refresh', 16), 'Another recipe') : null));

  card.append(head, body, foot);
  return card;
}

async function doChange(t, baseIdx, fn, ctx) {
  const p = getProfile(t);
  const res = fn(t.versions[baseIdx], p);
  if (res.noop) { ctx === 'chat' ? botSay(res.noop) : toast(res.noop); return; }
  const v = res.v;
  safetyPass(v, p);
  t.versions.push(v);
  const ni = t.versions.length - 1;
  if (ctx === 'chat') {
    setComposer('locked');
    const n = nutrition(v), fam = families(p);
    const safetyNotes = v.notes.filter(x => x.startsWith('Safety check'));
    const trace = [
      { tool:'apply_change', text:v.notes.filter(x => !x.startsWith('Safety check')).join(' ') || 'Applied the change.' },
      { tool:'check_allergens', text: safetyNotes.length ? safetyNotes.join(' ') : fam.length || p.dislikes.length ? `Still free of ${joinList([...p.allergens, ...p.dislikes])}.` : 'No allergies on this profile.' },
      { tool:'estimate_nutrition', text:`${Math.round(n.kcal)} kcal and ${n.salt.toFixed(1)} g salt per serving.` },
      { tool:'check_safety', text:safetySummary(v, n) }
    ];
    currentThread = t;
    await postRecipe(t, ni, `Here's version ${ni + 1}.`, trace);
    setComposer('refine');
  } else {
    renderSavedDetail(t, ni);
    toast(`Saved as version ${ni + 1}`);
  }
}

/* ---------- saved ---------- */
function updateSavedCount() {
  const c = threads.filter(t => t.saved).length, b = $('#saved-count');
  b.textContent = c; b.hidden = c === 0;
}
function showView(name) {
  $('#view-chat').hidden = name !== 'chat';
  $('#view-saved').hidden = name !== 'saved';
  $('#composer').hidden = name !== 'chat';
  $('#tab-chat').setAttribute('aria-selected', String(name === 'chat'));
  $('#tab-saved').setAttribute('aria-selected', String(name === 'saved'));
  if (name === 'saved') renderSavedList();
  window.scrollTo(0, name === 'chat' ? document.body.scrollHeight : 0);
}
function renderSavedList() {
  const box = $('#view-saved');
  const items = threads.filter(t => t.saved).sort((a, b) => b.savedAt - a.savedAt);
  box.replaceChildren(
    el('h2', { class:'view-title', text:'Saved recipes' }),
    el('p', { class:'muted', text:'Saved recipes live here, separate from your chats. Each one keeps every version you made.' }),
    items.length
      ? el('ul', { class:'saved-list' }, items.map(t => {
          const v = t.versions[t.versions.length - 1], p = getProfile(t);
          return el('li', {}, el('button', { type:'button', class:'saved-item', onclick:() => renderSavedDetail(t, t.versions.length - 1) },
            el('span', { class:'saved-title', text:v.title }),
            el('span', { class:'saved-meta', text:`${t.versions.length} ${t.versions.length === 1 ? 'version' : 'versions'}, for ${p.name}` }),
            icon('chev', 18)));
        }))
      : el('div', { class:'empty' }, icon('bookmark', 28), el('p', { text:'Nothing saved yet. Tap Save recipe on a recipe card to keep it here.' }),
          el('button', { type:'button', class:'btn', onclick:() => showView('chat') }, 'Back to chat')));
}
function renderSavedDetail(t, idx) {
  const box = $('#view-saved');
  box.replaceChildren(
    el('button', { type:'button', class:'back', onclick:renderSavedList }, icon('back', 18), 'All saved recipes'),
    el('div', { class:'vpills', role:'tablist', 'aria-label':'Versions' }, t.versions.map((v, i) =>
      el('button', { type:'button', role:'tab', class:'vtab', 'aria-selected':String(i === idx), onclick:() => renderSavedDetail(t, i) },
        `Version ${i + 1}`, el('span', { text: i === 0 ? 'Original' : v.label })))),
    renderRecipeCard(t, idx, 'saved'),
    el('div', { class:'saved-refine' },
      el('p', { class:'muted small', text:'Refine this version. Each change is saved as a new version.' }),
      el('div', { class:'refine-row inline' }, REFINES.map(r => el('button', { type:'button', class:'rchip', onclick:() => doChange(t, idx, (src, p) => applyOp(r.op, src, p), 'saved') }, r.label)))));
  window.scrollTo(0, 0);
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ---------- wiring ---------- */
$('#brand-logo').append(logoMark(30));
$('#new-chat').append(icon('newchat', 18));
$('#composer-send').append(icon('send', 18));
$('#banner-x').append(icon('x', 14));
$('#banner-x').addEventListener('click', () => $('#banner').remove());
$('#new-chat').addEventListener('click', () => { showView('chat'); startChat(); });
$('#tab-chat').addEventListener('click', () => showView('chat'));
$('#tab-saved').addEventListener('click', () => showView('saved'));
refineRow.append(...REFINES.map(r => el('button', { type:'button', class:'rchip', onclick:() => { cInput.value = r.label; cInput.focus(); } }, r.label)));

// No <form>: sandboxed previews can block form submission, so Enter and the send button are handled directly.
cInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendComposer(); }
});
cSend.addEventListener('click', sendComposer);

async function sendComposer() {
  const text = cInput.value.trim();
  if (!text || composerMode === 'locked') return;
  cInput.value = '';
  if (composerMode === 'intro') return handleIntro(text, false);
  if (composerMode === 'refine' && currentThread) {
    userSay(text);
    const op = detectOp(text);
    if (!op) { await botThinking(400); botSay('In this prototype I can make a recipe spicier, richer, simpler, lower in salt or higher in protein. Try one of the suggestions above the input.'); return; }
    const t = currentThread;
    await doChange(t, t.versions.length - 1, (src, p) => applyOp(op, src, p), 'chat');
  }
}

startChat();
})();
</script>
