# Qdrant vector database for the recipe index (section 3 of docs/MILESTONE2.md).
# Start:  docker compose up -d        Stop:  docker compose down
# Dashboard: http://localhost:6333/dashboard
services:
  qdrant:
    # Pinned to match qdrant-client 1.20 (client and server should stay within one minor version).
    image: qdrant/qdrant:v1.20.0
    container_name: nibble-qdrant
    ports:
      - "6333:6333"   # REST API and dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage   # index survives restarts; ignored by git
    restart: unless-stopped
